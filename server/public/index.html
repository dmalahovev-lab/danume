<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    
    <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e0e0e;
            color: #e9edef;
            height: 100vh;
            overflow: hidden;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0e0e0e;
        }
        .login-box {
            background: #1a1a1a;
            padding: 40px 36px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 380px;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 24px;
        }
        .login-box h1 i { color: #7c3aed; }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #0e0e0e;
            color: #e9edef;
            font-size: 14px;
            outline: none;
        }
        .login-box input:focus { border-color: #7c3aed; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: #6d28d9; }
        .login-box .error { color: #ef4444; text-align: center; margin-top: 10px; font-size: 13px; }
        .hidden { display: none !important; }
        
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0e0e0e;
            overflow: hidden;
        }
        
        .sidebar {
            width: 360px;
            min-width: 360px;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            background: #0e0e0e;
        }
        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .sidebar-header h2 { font-size: 18px; }
        .sidebar-header h2 i { color: #7c3aed; }
        .sidebar-header button {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
        }
        .sidebar-header button:hover { background: #1a1a1a; color: #e9edef; }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 12px;
            margin: 2px 8px;
        }
        .chat-item:hover { background: #1a1a1a; }
        .chat-item.active { background: #1a1a1a; }
        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #7c3aed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
            text-transform: uppercase;
            overflow: hidden;
        }
        .chat-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-item .avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            background: #7c3aed;
            border-radius: 50%;
            border: 2px solid #0e0e0e;
        }
        .chat-item .info { flex: 1; min-width: 0; }
        .chat-item .info .name { font-weight: 500; font-size: 15px; }
        .chat-item .info .last-msg { font-size: 13px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .meta { text-align: right; flex-shrink: 0; margin-left: 8px; }
        .chat-item .meta .time { font-size: 11px; color: #8e8e93; }
        .chat-item .meta .unread {
            background: #7c3aed;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 14px;
            min-width: 20px;
            text-align: center;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0e0e0e;
        }
        .chat-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            min-height: 60px;
        }
        .chat-header .left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .chat-header .left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #7c3aed;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            overflow: hidden;
        }
        .chat-header .left .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header .left .info h3 { font-size: 16px; font-weight: 600; }
        .chat-header .left .info p { font-size: 13px; color: #8e8e93; }
        .chat-header .actions { display: flex; gap: 8px; }
        .chat-header .actions button {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .chat-header .actions button:hover { background: #1a1a1a; color: #e9edef; }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }
        .message-wrapper.own { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.other { align-self: flex-start; align-items: flex-start; }
        .message-bubble {
            padding: 8px 14px;
            border-radius: 18px;
            background: #1a1a1a;
            color: #e9edef;
            word-wrap: break-word;
        }
        .message-wrapper.own .message-bubble { background: #7c3aed; border-bottom-right-radius: 6px; }
        .message-wrapper.other .message-bubble { background: #1a1a1a; border-bottom-left-radius: 6px; }
        .message-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .message-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 11px;
            color: #8e8e93;
        }
        .message-wrapper.own .message-meta { justify-content: flex-end; }
        
        .input-area {
            padding: 10px 20px 14px;
            border-top: 1px solid #2a2a2a;
            background: #0e0e0e;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .input-area .tools { display: flex; gap: 2px; align-items: center; }
        .input-area .tools button {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area .tools button:hover { color: #7c3aed; }
        .input-wrapper {
            flex: 1;
            background: #1a1a1a;
            border-radius: 26px;
            border: 1px solid #2a2a2a;
            padding: 4px 14px;
            display: flex;
            align-items: flex-end;
            min-height: 44px;
        }
        .input-wrapper:focus-within { border-color: #7c3aed; }
        .input-wrapper textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #e9edef;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            padding: 8px 0;
            max-height: 100px;
            line-height: 1.5;
        }
        .input-wrapper textarea::placeholder { color: #8e8e93; }
        .input-wrapper .send-btn {
            background: #7c3aed;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-wrapper .send-btn:hover { background: #6d28d9; }
        .input-wrapper .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a1a;
            color: #e9edef;
            padding: 10px 24px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 99999;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #8e8e93; border-radius: 10px; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: unset; }
            .chat-area { width: 100%; }
            .message-wrapper { max-width: 85%; }
        }
    </style>
</head>
<body>

<!-- ==========================================
   ЭКРАН ВХОДА
========================================== -->
<div class="login-container" id="loginContainer">
    <div class="login-box">
        <h1><i class="fas fa-comment-dots"></i> Мессенджер</h1>
        <input type="text" id="loginUsername" placeholder="Имя пользователя">
        <input type="text" id="loginDisplayName" placeholder="Отображаемое имя (опционально)">
        <button onclick="login()">Войти</button>
        <div class="error" id="loginError"></div>
    </div>
</div>

<!-- ==========================================
   ОСНОВНОЙ ИНТЕРФЕЙС
========================================== -->
<div class="app-container hidden" id="app">
    <!-- Боковая панель -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-comment-dots"></i> Мессенджер</h2>
            <div>
                <button onclick="startNewChat()" title="Новый чат"><i class="fas fa-pen"></i></button>
                <button onclick="logout()" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div class="chat-list" id="chatList">
            <div style="text-align:center;padding:40px 20px;color:#8e8e93;">
                <i class="fas fa-spinner fa-spin" style="font-size:24px;"></i>
                <p style="margin-top:10px;">Загрузка...</p>
            </div>
        </div>
    </div>

    <!-- Область чата -->
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <div class="left" onclick="toggleInfo()">
                <div class="avatar" id="chatAvatar">А</div>
                <div class="info">
                    <h3 id="chatName">Выберите чат</h3>
                    <p id="chatStatus">онлайн</p>
                </div>
            </div>
            <div class="actions">
                <button onclick="showToast('Голосовой звонок')"><i class="fas fa-phone"></i></button>
                <button onclick="showToast('Видеозвонок')"><i class="fas fa-video"></i></button>
                <button onclick="toggleInfo()"><i class="fas fa-info-circle"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div style="text-align:center;padding:60px 20px;color:#8e8e93;">
                <i class="fas fa-comment" style="font-size:40px;opacity:0.2;margin-bottom:12px;display:block;"></i>
                <p style="font-size:16px;font-weight:500;">Выберите чат</p>
                <p style="font-size:13px;">Начните общение</p>
            </div>
        </div>

        <div class="input-area" id="inputArea" style="display:none;">
            <div class="tools">
                <button onclick="showToast('😊 Эмодзи')" title="Эмодзи"><i class="far fa-smile"></i></button>
                <button onclick="document.getElementById('fileInput').click()" title="Прикрепить файл"><i class="fas fa-paperclip"></i></button>
                <input type="file" id="fileInput" style="display:none" multiple>
            </div>
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Сообщение..." maxlength="4096" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- ==========================================
   TOAST
========================================== -->
<div class="toast" id="toast"></div>

<script>
// ================================================
// ПОЛНАЯ ЛОГИКА КЛИЕНТА
// ================================================

// ---------- КОНСТАНТЫ ----------
const PUSHER_KEY = 'a435e7b37fd04dc88910';
const PUSHER_CLUSTER = 'eu';

// ---------- ПЕРЕМЕННЫЕ ----------
let currentUser = null;
let currentChatId = null;
let pusher = null;
let channel = null;
let allUsers = [];
let allChats = [];
let chatMessages = [];
let toastTimeout = null;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const loginContainer = $('loginContainer');
const appContainer = $('app');
const loginError = $('loginError');
const chatList = $('chatList');
const messagesContainer = $('messagesContainer');
const messageInput = $('messageInput');
const sendBtn = $('sendBtn');
const inputArea = $('inputArea');
const chatName = $('chatName');
const chatStatus = $('chatStatus');
const chatAvatar = $('chatAvatar');

// ---------- АВТОРИЗАЦИЯ ----------
async function login() {
    const username = $('loginUsername').value.trim();
    const displayName = $('loginDisplayName').value.trim() || username;
    
    if (!username) {
        loginError.textContent = 'Введите имя пользователя';
        return;
    }
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, displayName })
        });
        
        const data = await response.json();
        if (data.success) {
            currentUser = data.user;
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            
            initPusher();
            loadUsers();
            loadChats();
            
            showToast('🎉 Добро пожаловать!');
        } else {
            loginError.textContent = data.error || 'Ошибка входа';
        }
    } catch (error) {
        loginError.textContent = 'Ошибка соединения с сервером';
    }
}

function logout() {
    if (pusher) {
        pusher.disconnect();
    }
    currentUser = null;
    currentChatId = null;
    loginContainer.classList.remove('hidden');
    appContainer.classList.add('hidden');
    showToast('Вы вышли из системы');
}

// ---------- PUSHER ----------
function initPusher() {
    pusher = new Pusher(PUSHER_KEY, {
        cluster: PUSHER_CLUSTER,
        forceTLS: true,
        authEndpoint: '/pusher/auth'
    });
    
    channel = pusher.subscribe(`private-user-${currentUser.id}`);
    
    channel.bind('new_message', (data) => {
        console.log('📨 Новое сообщение:', data);
        if (data.chatId === currentChatId) {
            chatMessages.push(data);
            renderMessages();
        }
        loadChats();
    });
    
    channel.bind('pusher:subscription_succeeded', () => {
        console.log('✅ Подписка на канал успешна');
    });
}

// ---------- ЗАГРУЗКА ДАННЫХ ----------
async function loadUsers() {
    try {
        const response = await fetch('/api/users');
        allUsers = await response.json();
    } catch (error) {
        console.error('Ошибка загрузки пользователей:', error);
    }
}

async function loadChats() {
    try {
        const response = await fetch(`/api/chats/${currentUser.id}`);
        allChats = await response.json();
        renderChatList();
    } catch (error) {
        console.error('Ошибка загрузки чатов:', error);
    }
}

// ---------- ОТОБРАЖЕНИЕ ----------
function renderChatList() {
    if (!allChats.length) {
        chatList.innerHTML = `
            <div style="text-align:center;padding:40px 20px;color:#8e8e93;">
                <i class="fas fa-inbox" style="font-size:28px;opacity:0.3;display:block;margin-bottom:10px;"></i>
                <p>Нет чатов</p>
                <p style="font-size:13px;">Создайте новый чат, нажав ✏️</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    allChats.forEach(chat => {
        const isActive = chat.id === currentChatId;
        const lastText = chat.lastMessage ? chat.lastMessage.text : 'Нет сообщений';
        const time = chat.lastMessage ? new Date(chat.lastMessage.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
        
        let online = false;
        let displayName = chat.displayName;
        let avatar = chat.avatar;
        
        if (chat.type === 'private') {
            const otherId = chat.participants.find(id => id !== currentUser.id);
            const otherUser = allUsers.find(u => u.id === otherId);
            if (otherUser) {
                online = otherUser.online || false;
            }
        }
        
        html += `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChat('${chat.id}')">
                <div style="position:relative;">
                    <div class="avatar">${avatar}</div>
                    ${online ? '<div class="online-dot"></div>' : ''}
                </div>
                <div class="info">
                    <div class="name">${displayName}</div>
                    <div class="last-msg">${lastText}</div>
                </div>
                <div class="meta">
                    <div class="time">${time}</div>
                    ${chat.unreadCount > 0 ? `<div class="unread">${chat.unreadCount}</div>` : ''}
                </div>
            </div>
        `;
    });
    chatList.innerHTML = html;
}

function renderMessages() {
    if (!chatMessages.length) {
        messagesContainer.innerHTML = `
            <div style="text-align:center;padding:60px 20px;color:#8e8e93;">
                <i class="fas fa-comment" style="font-size:40px;opacity:0.2;margin-bottom:12px;display:block;"></i>
                <p style="font-size:16px;font-weight:500;">Нет сообщений</p>
                <p style="font-size:13px;">Напишите что-нибудь!</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    chatMessages.forEach(msg => {
        const isOwn = msg.senderId === currentUser.id;
        const wrapperClass = isOwn ? 'message-wrapper own' : 'message-wrapper other';
        const sender = allUsers.find(u => u.id === msg.senderId);
        const senderName = sender ? sender.displayName : 'Неизвестный';
        const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        
        html += `
            <div class="${wrapperClass}">
                ${!isOwn ? `<div style="font-size:11px;color:#8e8e93;margin-bottom:2px;">${senderName}</div>` : ''}
                <div class="message-bubble">
                    <div class="message-text">${escapeHtml(msg.text)}</div>
                    <div class="message-meta">
                        <span>${time}</span>
                        ${isOwn ? `<span>✓</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    messagesContainer.innerHTML = html;
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ---------- ПЕРЕКЛЮЧЕНИЕ ЧАТА ----------
async function switchChat(chatId) {
    currentChatId = chatId;
    inputArea.style.display = 'flex';
    sendBtn.disabled = true;
    
    const chat = allChats.find(c => c.id === chatId);
    if (chat) {
        chatName.textContent = chat.displayName;
        chatAvatar.textContent = chat.avatar || 'Ч';
        chatStatus.textContent = chat.type === 'private' ? 'онлайн' : `${chat.participants.length} участников`;
    }
    
    try {
        const response = await fetch(`/api/history/${chatId}`);
        chatMessages = await response.json();
        renderMessages();
    } catch (error) {
        console.error('Ошибка загрузки истории:', error);
    }
    
    renderChatList();
    
    // Фокус на поле ввода
    setTimeout(() => messageInput.focus(), 100);
}

// ---------- ОТПРАВКА СООБЩЕНИЯ ----------
async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentChatId) return;
    
    try {
        await fetch('/api/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chatId: currentChatId,
                text: text,
                fromUserId: currentUser.id
            })
        });
        
        messageInput.value = '';
        sendBtn.disabled = true;
        autoResizeTextarea();
    } catch (error) {
        showToast('❌ Ошибка отправки');
    }
}

// ---------- СОЗДАНИЕ НОВОГО ЧАТА ----------
async function startNewChat() {
    const userList = allUsers.filter(u => u.id !== currentUser.id);
    
    if (!userList.length) {
        showToast('Нет доступных пользователей');
        return;
    }
    
    // Простой выбор через prompt
    let message = 'Выберите пользователя:\n\n';
    userList.forEach((u, i) => {
        message += `${i + 1}. ${u.displayName} (@${u.username}) ${u.online ? '🟣' : '⚪'}\n`;
    });
    message += '\nВведите номер:';
    
    const choice = prompt(message);
    if (!choice) return;
    
    const index = parseInt(choice) - 1;
    if (index < 0 || index >= userList.length) {
        showToast('❌ Неверный выбор');
        return;
    }
    
    const selectedUser = userList[index];
    
    try {
        const response = await fetch('/api/create-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId1: currentUser.id,
                userId2: selectedUser.id
            })
        });
        
        const chat = await response.json();
        await loadChats();
        switchChat(chat.id);
        showToast(`💬 Чат с ${selectedUser.displayName} создан!`);
    } catch (error) {
        showToast('❌ Ошибка создания чата');
    }
}

// ---------- ИНФОРМАЦИЯ ----------
function toggleInfo() {
    if (!currentChatId) {
        showToast('Выберите чат');
        return;
    }
    const chat = allChats.find(c => c.id === currentChatId);
    if (!chat) return;
    
    let info = `📋 Информация о чате\n\n`;
    info += `Название: ${chat.displayName}\n`;
    info += `Тип: ${chat.type === 'private' ? 'Личный' : 'Группа'}\n`;
    info += `Сообщений: ${chatMessages.length}\n`;
    
    if (chat.type === 'private') {
        const otherId = chat.participants.find(id => id !== currentUser.id);
        const otherUser = allUsers.find(u => u.id === otherId);
        if (otherUser) {
            info += `\n👤 ${otherUser.displayName}\n`;
            info += `@${otherUser.username}\n`;
            info += `${otherUser.online ? '🟣 Онлайн' : '⚪ Не в сети'}`;
        }
    }
    
    alert(info);
}

// ---------- ВСПОМОГАТЕЛЬНЫЕ ----------
function autoResizeTextarea() {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// ---------- СОБЫТИЯ ----------
messageInput.addEventListener('input', () => {
    const text = messageInput.value.trim();
    sendBtn.disabled = text.length === 0;
    autoResizeTextarea();
});
